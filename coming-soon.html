<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STVRHUNTER — Coming Soon</title>
    <meta name="description" content="STVRHUNTER — Multidisciplinary Designer. Website coming soon.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background: #EDEBE6;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .coming-soon {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            justify-content: center;
        }

        .coming-soon__portrait {
            margin-bottom: 0.5rem;
            margin-top: -8vh;
        }

        .coming-soon__portrait img {
            height: clamp(200px, 30vh, 300px);
            width: auto;
            display: block;
        }

        .coming-soon__title {
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: clamp(3.5rem, 2rem + 8vw, 8rem);
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.02em;
            text-transform: lowercase;
        }

        .coming-soon__subtitle {
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: clamp(1rem, 0.9rem + 0.5vw, 1.25rem);
            font-weight: 400;
            line-height: 1.6;
            color: #000000;
            margin-top: 1.5rem;
        }

        .coming-soon__footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding-bottom: 2rem;
        }

        .coming-soon__links {
            display: flex;
            gap: 2rem;
        }

        .coming-soon__link {
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: clamp(0.875rem, 0.8rem + 0.3vw, 1rem);
            font-weight: 400;
            color: #000000;
            text-decoration: none;
            transition: opacity 150ms ease;
            position: relative;
        }

        .coming-soon__link::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 1px;
            background: #000000;
            transition: width 250ms ease;
        }

        .coming-soon__link:hover {
            opacity: 0.5;
        }

        .coming-soon__link:hover::after {
            width: 100%;
        }

        @media (max-width: 768px) {
            .coming-soon__link {
                font-size: clamp(1rem, 0.9rem + 0.5vw, 1.25rem);
            }
        }

        .coming-soon__copyright {
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
            font-weight: 400;
            color: #999999;
        }
    </style>
</head>
<body>
    <div class="coming-soon">
        <div class="coming-soon__portrait">
            <img src="assets/GIF_face.gif" alt="STVRHUNTER Portrait">
        </div>
        <h1 class="coming-soon__title">coming soon 👀</h1>
        <p class="coming-soon__subtitle">Website is still in development. Stay tuned.</p>
    </div>
    <footer class="coming-soon__footer">
        <div class="coming-soon__links">
            <a href="https://t.me/stvrhunter" target="_blank" class="coming-soon__link">tg</a>
            <a href="https://linkedin.com/in/stvrhunter" target="_blank" class="coming-soon__link">linkedin</a>
            <a href="https://instagram.com/stvrhunter" target="_blank" class="coming-soon__link">inst</a>
            <a href="https://x.com/stvrhunter" target="_blank" class="coming-soon__link">x.com</a>
            <a href="https://behance.net/stvrhunter" target="_blank" class="coming-soon__link">behance</a>
        </div>
        <span class="coming-soon__copyright">© 2026</span>
    </footer>
</body>
</html>
